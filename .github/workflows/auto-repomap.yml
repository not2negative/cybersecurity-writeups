name: Auto-Update RepoMap & Index

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-map:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update .repomap.json, README map and Writeups Index
        run: |
          python3 - << 'EOF'
          import os, re, json, hashlib, subprocess
          from datetime import datetime
          from urllib.parse import quote

          META_FILE = ".repomap.json"
          README_FILE = "README.md"
          REPO_USER = "not2negative"
          REPO_NAME = "cybersecurity-writeups"
          WIDGET_BASE = "https://github-tree-widget.vercel.app"
          DEFAULT_IGNORE = [".repomap.json", ".gitkeep", ".gitignore", ".nojekyll", ".github", "docs"]

          if os.path.exists(META_FILE):
              with open(META_FILE, "r", encoding="utf-8") as f:
                  data = json.load(f)
          else:
              data = {"ignore": DEFAULT_IGNORE, "items": {}}

          ignore = set(data.get("ignore", DEFAULT_IGNORE))
          ignore.update([".github", "docs", ".nojekyll"])
          data["ignore"] = sorted(ignore)
          items = data.setdefault("items", {})

          def parse_writeup_meta(filepath):
              meta = {}
              title = ""
              body_sample = ""
              try:
                  with open(filepath, "r", encoding="utf-8") as f:
                      content = f.read()
                  m = re.search(r"<!--\s*meta\s*(.*?)\s*-->", content, re.DOTALL | re.IGNORECASE)
                  if m:
                      for line in m.group(1).splitlines():
                          if ":" in line:
                              k, v = line.split(":", 1)
                              meta[k.strip().lower()] = v.strip()
                  for line in content.splitlines():
                      s = line.strip()
                      if s.startswith("# ") and not title:
                          title = s[2:].strip()
                          break
                  body_sample = content[:1500].lower()
              except Exception:
                  pass

              if "title" not in meta:
                  if title:
                      meta["title"] = title
                  else:
                      stem = os.path.splitext(os.path.basename(filepath))[0]
                      stem = re.sub(r"[._-]htb$", "", stem, flags=re.IGNORECASE)
                      meta["title"] = stem.replace("_", " ").replace("-", " ").title()

              if "os" not in meta:
                  meta["os"] = "Windows" if "windows" in body_sample else "Linux"

              if "difficulty" not in meta:
                  for diff in ("Easy", "Medium", "Hard", "Insane"):
                      if diff.lower() in body_sample:
                          meta["difficulty"] = diff
                          break
                  else:
                      meta["difficulty"] = "—"

              if "vectors" not in meta:
                  desc = items.get(filepath, {}).get("description", "")
                  meta["vectors"] = desc if desc else (title[:65] if title else "—")

              if "date" not in meta:
                  try:
                      out = subprocess.check_output(
                          ["git", "log", "-1", "--format=%cd", "--date=format:%b %Y", "--", filepath],
                          text=True
                      ).strip()
                      meta["date"] = out if out else datetime.utcnow().strftime("%b %Y")
                  except Exception:
                      meta["date"] = datetime.utcnow().strftime("%b %Y")

              return meta

          valid_paths = set()
          for root, dirs, files in os.walk("."):
              rel_root = "" if root == "." else os.path.relpath(root, ".").replace("\\", "/")
              dirs[:] = [
                  d for d in dirs
                  if d != ".git" and d not in ignore
                  and (f"{rel_root}/{d}" if rel_root else d) not in ignore
              ]

              for d in dirs:
                  rel_path = f"{rel_root}/{d}" if rel_root else d
                  valid_paths.add(rel_path)
                  if rel_path not in items:
                      items[rel_path] = {"description": f"{d} directory"}

              for file in files:
                  rel_path = f"{rel_root}/{file}" if rel_root else file
                  if file in ignore or rel_path in ignore:
                      continue
                  valid_paths.add(rel_path)
                  if rel_path not in items:
                      ext = os.path.splitext(file)[1].lower()
                      if ext == ".md":
                          m = parse_writeup_meta(rel_path)
                          desc = m.get("vectors") if m.get("vectors") != "—" else m.get("title", "")
                          items[rel_path] = {"description": desc[:70]} if desc else {}
                      else:
                          items[rel_path] = {}

          data["items"] = {k: v for k, v in items.items() if k in valid_paths}

          with open(META_FILE, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
              f.write("\n")

          if os.path.exists(README_FILE):
              with open(README_FILE, "r", encoding="utf-8") as f:
                  readme = f.read()

              if os.path.isdir("HTB"):
                  htb_files = sorted(
                      f"HTB/{fn}" for fn in os.listdir("HTB")
                      if fn.endswith(".md") and fn not in ignore
                  )
                  rows = [
                      "| Machine | OS | Difficulty | Key Vectors & Technologies | Date |",
                      "| :--- | :---: | :---: | :--- | :---: |"
                  ]
                  for fp in htb_files:
                      m = parse_writeup_meta(fp)
                      vectors = m["vectors"]
                      if "`" not in vectors and "·" in vectors:
                          vectors = " ".join(f"`{v.strip()}`" for v in vectors.split("·"))
                      rows.append(
                          f"| [**{m['title']}**](./{fp}) | {m['os']} | {m['difficulty']} | {vectors} | {m['date']} |"
                      )
                  table_block = "<!-- HTB-INDEX:START -->\n" + "\n".join(rows) + "\n<!-- HTB-INDEX:END -->"
                  readme, _ = re.subn(
                      r"<!-- HTB-INDEX:START -->.*?<!-- HTB-INDEX:END -->",
                      table_block,
                      readme,
                      flags=re.DOTALL
                  )

              root_node = {"name": REPO_NAME, "path": "", "type": "tree", "children": []}
              node_map = {"": root_node}
              entries = []
              for p in sorted(valid_paths):
                  is_dir = os.path.isdir(p)
                  entries.append((0 if is_dir else 1, p, is_dir))
              entries.sort()

              for _, p, is_dir in entries:
                  parts = p.split("/")
                  name = parts.pop()
                  parent = "/".join(parts)
                  n = {"name": name, "path": p, "type": "tree" if is_dir else "blob", "children": []}
                  node_map[p] = n
                  if parent in node_map:
                      node_map[parent]["children"].append(n)

              ordered_nodes = []
              def collect(n):
                  ordered_nodes.append(n)
                  for c in n["children"]:
                      collect(c)
              collect(root_node)

              cache_bust = hashlib.md5(json.dumps(data, sort_keys=True).encode()).hexdigest()[:6]
              map_lines = ['<p align="center">']
              for idx, n in enumerate(ordered_nodes):
                  if n["path"] == "":
                      gh_url = f"https://github.com/{REPO_USER}/{REPO_NAME}"
                  else:
                      kind = "tree" if n["type"] == "tree" else "blob"
                      encoded_p = "/".join(quote(seg) for seg in n["path"].split("/"))
                      gh_url = f"https://github.com/{REPO_USER}/{REPO_NAME}/{kind}/main/{encoded_p}"
                  img_url = f"{WIDGET_BASE}/api/svg?user={REPO_USER}&repo={REPO_NAME}&row={idx}&v={cache_bust}"
                  br = "<br/>" if idx < len(ordered_nodes) - 1 else ""
                  map_lines.append(f'  <a href="{gh_url}"><img src="{img_url}" width="100%" /></a>{br}')
              map_lines.append("</p>")

              repomap_block = "<!-- REPOMAP:START -->\n" + "\n".join(map_lines) + "\n<!-- REPOMAP:END -->"
              readme, _ = re.subn(
                  r"<!-- REPOMAP:START -->.*?<!-- REPOMAP:END -->",
                  repomap_block,
                  readme,
                  flags=re.DOTALL
              )

              with open(README_FILE, "w", encoding="utf-8") as f:
                  f.write(readme)
          EOF

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .repomap.json README.md
          if ! git diff --staged --quiet; then
            git commit -m "chore: update repomap and writeups index"
            git push
          fi