<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cybersecurity Writeups Repository Explorer</title>
  <style>
    body {
      background: #010409;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 960px;
      margin: 32px auto;
      padding: 0 16px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    h2 { font-size: 18px; font-weight: 600; margin: 0; }
    a { color: #58a6ff; text-decoration: none; font-size: 14px; }
    a:hover { text-decoration: underline; }
    iframe {
      width: 100%;
      height: 480px;
      border: none;
      border-radius: 10px;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <header>
    <h2>Cybersecurity Writeups Repository Explorer</h2>
    <a id="go-back" href="https://github.com/not2negative/cybersecurity-writeups">&larr; Go back</a>
  </header>

  <iframe
    src="https://github-tree-widget.vercel.app/?user=not2negative&repo=cybersecurity-writeups"
    title="Interactive repository map"
    scrolling="no"
    loading="lazy">
  </iframe>

  <script>
    const backLink = document.getElementById("go-back");
    backLink.addEventListener("click", (e) => {
      if (window.history.length > 1 && document.referrer) {
        e.preventDefault();
        window.history.back();
      }
    });
  </script>
</body>
</html>
